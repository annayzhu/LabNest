name: AI provider acceptance
on:
  pull_request:
    paths: ['src/lib/ai*', 'src/lib/entries.ts', 'src/app/api/ai/**', 'src/app/settings/**', 'src/app/entries/**', 'src/app/actions/manual/**', 'src/components/*Ai*', 'src/components/ProposedActionCard.tsx', 'scripts/*ai-provider*', 'prisma/**', '.github/workflows/ai-provider.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  acceptance:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labnest_ai_provider_acceptance_20261008
        ports: ['5432:5432']
        options: --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labnest_ai_provider_acceptance_20261008
      LABNEST_AI_ENCRYPTION_KEY: '1111111111111111111111111111111111111111111111111111111111111111'
      LABNEST_BUILD_DIR: .next/ai-production
      LABNEST_TSCONFIG_PATH: tsconfig.calculator.json
      LABNEST_E2E_BASE_URL: http://localhost:3338
      TZ: Asia/Shanghai
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run lint
      - run: TZ=Asia/Shanghai npm test
      - run: TZ=UTC npm test
      - run: npx playwright install --with-deps chromium webkit
      - run: npm run build
      - name: Start isolated application
        run: |
          node scripts/ai-provider-acceptance-server.mjs > ai-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:3338/api/health; then exit 0; fi
            sleep 1
          done
          cat ai-server.log
          exit 1
      - run: node scripts/verify-ai-provider-adapters.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ai-provider-evidence
          path: |
            docs/ai/20261008/evidence/browser
            ai-server.log
