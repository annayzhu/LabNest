name: Backup restore acceptance
on:
  pull_request:
    paths: ['src/lib/backup/**', 'scripts/*backup*', 'prisma/**', 'package*.json', '.github/workflows/backup.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  restore:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labnest_backup_qa
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labnest_backup_qa
      LABNEST_PG_BIN: .qa-pg-bin
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx prisma generate && npx prisma migrate deploy
      - name: Use the service's matching PostgreSQL client tools
        env:
          PG_CONTAINER: ${{ job.services.postgres.id }}
        run: |
          mkdir .qa-pg-bin
          for tool in pg_dump pg_restore; do
            printf '#!/bin/sh\nexec docker exec -i -e PGPASSWORD %s %s "$@"\n' "$PG_CONTAINER" "$tool" > ".qa-pg-bin/$tool"
            chmod +x ".qa-pg-bin/$tool"
          done
      - run: npx tsx scripts/verify-backup-restore.ts
