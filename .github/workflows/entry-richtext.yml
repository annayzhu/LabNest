name: Entry rich text acceptance
on:
  pull_request:
    paths: ['src/**', 'scripts/*entry*', 'prisma/**', 'package*.json', '.github/workflows/entry-richtext.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: labnest_entry_richtext_test_20261006
        ports: ['5432:5432']
        options: >-
          --health-cmd pg_isready --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      DATABASE_URL: postgresql://postgres:postgres@localhost:5432/labnest_entry_richtext_test_20261006
      PORT: '3331'
      TZ: Asia/Shanghai
      NEXT_TELEMETRY_DISABLED: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: sudo apt-get update && sudo apt-get install -y poppler-utils fonts-noto-cjk
      - run: npm ci
      - run: npx playwright install --with-deps chromium
      - run: npx prisma migrate deploy
      - run: npm run build
      - name: Start isolated production server
        run: |
          npm run start > entry-server.log 2>&1 &
          for attempt in $(seq 1 60); do
            if curl --fail http://localhost:3331/api/health; then exit 0; fi
            sleep 1
          done
          cat entry-server.log
          exit 1
      - run: npx tsx scripts/seed-entry-richtext.ts
      - run: node scripts/verify-entry-richtext-pages.mjs
      - run: node scripts/verify-entry-keyboard.mjs
      - run: node scripts/verify-entry-richtext-exports.mjs
      - run: node scripts/verify-entry-feedback.mjs
      - run: node scripts/verify-entry-richtext.mjs
      - run: node scripts/verify-entry-richtext-focus.mjs
      - run: node scripts/verify-entry-richtext-drag.mjs
      - run: npx tsx scripts/verify-entry-relations.ts
      - run: npx tsx scripts/verify-entry-step-freeze.ts
      - run: npx tsx scripts/seed-entry-richtext-advanced.ts && node scripts/verify-entry-richtext-advanced.mjs
      - run: node scripts/verify-entry-richtext-mixed.mjs
      - run: node scripts/verify-entry-media-loading.mjs
      - run: node scripts/verify-entry-external-import.mjs
      - run: node scripts/verify-entry-draft-switch.mjs
      - run: node scripts/verify-entry-save-pending.mjs
      - run: node scripts/verify-entry-richtext-viewports.mjs
      - run: npx tsx scripts/seed-entry-audit-extra.ts
      - run: node scripts/verify-entry-plain-fields.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: entry-richtext-browser-evidence
          path: |
            docs/qa/evidence/entry-richtext
            entry-server.log
