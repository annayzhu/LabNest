name: Studio link integration
on:
  push:
    branches: [main]
    paths: ['src/lib/visualization-link*', 'src/lib/tool-manifest*', 'src/components/VisualizationMigration.tsx', 'src/app/tools/**', '.github/workflows/visualization-studio.yml']
  pull_request:
    paths: ['src/lib/visualization-link*', 'src/lib/tool-manifest*', 'src/components/VisualizationMigration.tsx', 'src/app/tools/**', '.github/workflows/visualization-studio.yml']
permissions:
  contents: read
jobs:
  integration:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npx vitest run src/lib/visualization-link.test.ts src/lib/tool-manifest.test.ts
      - run: npx eslint src/components/VisualizationMigration.tsx src/lib/visualization-link.ts src/app/tools/visualization/page.tsx
