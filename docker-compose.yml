services:
  postgres:
    image: postgres:16-alpine
    container_name: labnest-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: labnest
      POSTGRES_USER: labnest
      POSTGRES_PASSWORD: labnest
    ports:
      - "5432:5432"
    volumes:
      - labnest-postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labnest -d labnest"]
      interval: 5s
      timeout: 5s
      retries: 12

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: labnest-app
    restart: unless-stopped
    init: true
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      DATABASE_URL: postgresql://labnest:labnest@postgres:5432/labnest?schema=public
      LABNEST_ATTACHMENT_ROOT: /app/storage/attachments
      LABNEST_AI_ENCRYPTION_KEY: ${LABNEST_AI_ENCRYPTION_KEY:?LABNEST_AI_ENCRYPTION_KEY must be set in .env}
      NEXT_PUBLIC_APP_NAME: ${NEXT_PUBLIC_APP_NAME:-LabNest}
      QPCR_LAYOUT_TOOL_URL: ${QPCR_LAYOUT_TOOL_URL:-}
      CNV_LAYOUT_TOOL_URL: ${CNV_LAYOUT_TOOL_URL:-}
      QPCR_ANALYSIS_TOOL_URL: ${QPCR_ANALYSIS_TOOL_URL:-}
      CNV_ANALYSIS_TOOL_URL: ${CNV_ANALYSIS_TOOL_URL:-}
      NEXT_TELEMETRY_DISABLED: "1"
      HOSTNAME: 0.0.0.0
      PORT: "3000"
    ports:
      - "3000:3000"
    volumes:
      - labnest-attachments:/app/storage/attachments
    command: sh scripts/docker-start.sh
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:3000/api/health').then((response) => { if (!response.ok) process.exit(1) }).catch(() => process.exit(1))"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 90s
    stop_grace_period: 20s

volumes:
  labnest-postgres:
  labnest-attachments:
